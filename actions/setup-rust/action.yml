name: Set up Rust
description: Install Rust and restore the platform Cargo caches.

inputs:
  toolchain:
    description: Rust toolchain channel or version.
    default: stable
  components:
    description: Comma-separated Rust components.
    default: ""
  targets:
    description: Comma-separated Rust targets.
    default: ""
  cache-workspaces:
    description: Newline-separated Cargo workspace paths.
    default: .
  cache-shared-key:
    description: Extra cache-key material controlled by the caller.
    default: v1
  cache-targets:
    description: Cache Cargo target directories with the selected backend.
    default: "true"
  cache-target-backend:
    description: Cargo cache backend (github or s3). S3 reuses static compiler-cache credentials.
    default: github
  cache-zstd-level:
    description: Zstandard compression level for S3 target archives (1 through 19).
    default: "3"
  cache-s3-transfer:
    description: S3 target archive transfer mode (staged or streaming). Streaming supports Linux only.
    default: staged
  cache-save-if:
    description: Save the GitHub Cargo cache after the job.
    default: "true"
  add-rust-environment-hash-key:
    description: Include the Rust compiler environment in the cache key.
    default: "true"
  windows-sparse-index:
    description: Preserve the sparse registry index on Windows.
    default: "false"
  windows-sparse-index-path:
    description: Cargo sparse-index path on Windows.
    default: C:\Rust\cargo\registry\index
  windows-sparse-index-key:
    description: Sparse-index cache key. The default includes the caller and lockfile.
    default: ""
  linux-dependencies:
    description: Approved Linux dependency profile (none, build, or openssl).
    default: none
  compiler-cache-access-key:
    description: Bucket-scoped S3-compatible access key for static authentication.
    default: ""
  compiler-cache-auth:
    description: Compiler-cache authentication mode (static, ambient, or anonymous).
    default: static
  compiler-cache-endpoint:
    description: S3-compatible compiler-cache endpoint URL.
    default: ""
  compiler-cache-bucket:
    description: S3-compatible compiler-cache bucket.
    default: ""
  compiler-cache-secret-key:
    description: Bucket-scoped S3-compatible secret key for static authentication.
    default: ""
  compiler-cache-session-token:
    description: Optional S3-compatible session token for static authentication.
    default: ""

outputs:
  rust-cache-hit:
    description: Whether the Rust cache matched its primary key.
    value: ${{ inputs.cache-targets == 'true' && inputs.cache-target-backend == 'github' && steps.rust-cache.outputs.cache-hit || (inputs.cache-targets != 'true' || steps.s3-target-cache-staged.outputs.cache-hit == 'true' || steps.s3-target-cache-streaming.outputs.cache-hit == 'true') && (steps.cargo-registry-cache-github.outputs.cache-hit == 'true' || steps.cargo-registry-cache-s3.outputs.cache-hit == 'true') }}
  sparse-index-cache-hit:
    description: Whether the Windows sparse-index cache matched its primary key.
    value: ${{ steps.sparse-index-cache.outputs.cache-hit || (inputs.cache-target-backend == 's3' && steps.cargo-registry-cache-s3.outputs.cache-hit) }}
  offline:
    description: Whether every enabled Cargo cache matched its primary key.
    value: ${{ (inputs.cache-targets == 'true' && inputs.cache-target-backend == 'github' && steps.rust-cache.outputs.cache-hit == 'true' || (inputs.cache-targets != 'true' || steps.s3-target-cache-staged.outputs.cache-hit == 'true' || steps.s3-target-cache-streaming.outputs.cache-hit == 'true') && (steps.cargo-registry-cache-github.outputs.cache-hit == 'true' || steps.cargo-registry-cache-s3.outputs.cache-hit == 'true')) && (inputs.windows-sparse-index != 'true' || inputs.cache-target-backend == 's3' || steps.sparse-index-cache.outputs.cache-hit == 'true') }}
  compiler-cache-enabled:
    description: Whether the remote compiler-output cache was configured.
    value: ${{ steps.sccache-enabled.outputs.enabled }}

runs:
  using: composite
  steps:
    - name: Validate Cargo cache backend
      shell: bash
      env:
        BACKEND: ${{ inputs.cache-target-backend }}
      run: |
        case "$BACKEND" in
          github|s3) ;;
          *) echo 'Cargo cache backend must be github or s3.' >&2; exit 1 ;;
        esac

    - name: Validate S3 target cache compression level
      if: inputs.cache-targets == 'true' && inputs.cache-target-backend == 's3'
      shell: bash
      env:
        LEVEL: ${{ inputs.cache-zstd-level }}
      run: |
        if [[ ! "$LEVEL" =~ ^([1-9]|1[0-9])$ ]]; then
          echo 'S3 target cache compression level must be an integer from 1 through 19.' >&2
          exit 1
        fi

    - name: Validate S3 target cache transfer mode
      if: inputs.cache-targets == 'true' && inputs.cache-target-backend == 's3'
      shell: bash
      env:
        TRANSFER: ${{ inputs.cache-s3-transfer }}
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        case "$TRANSFER" in
          staged) ;;
          streaming)
            if [[ "$RUNNER_OS_NAME" != Linux ]]; then
              echo 'Streaming S3 target caches require Linux.' >&2
              exit 1
            fi
            ;;
          *) echo 'S3 target cache transfer mode must be staged or streaming.' >&2; exit 1 ;;
        esac

    - name: Validate Linux dependency profile
      shell: bash
      env:
        PROFILE: ${{ inputs.linux-dependencies }}
      run: |
        case "$PROFILE" in
          none|build|openssl) ;;
          *)
            echo "Unknown Linux dependency profile: $PROFILE" >&2
            exit 1
            ;;
        esac

    - name: Install Linux build dependencies
      if: runner.os == 'Linux' && inputs.linux-dependencies != 'none'
      shell: bash
      env:
        PROFILE: ${{ inputs.linux-dependencies }}
      run: |
        if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
        fi
        packages=(build-essential pkg-config)
        if [[ "$PROFILE" == openssl ]]; then
          packages+=(libssl-dev)
        fi
        sudo apt-get update
        sudo apt-get install -y "${packages[@]}"

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Resolve lockfile hash
      id: lockfile
      shell: bash
      run: echo "hash=${{ hashFiles('**/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: inputs.cache-targets == 'true' && inputs.cache-target-backend == 'github'
      id: rust-cache
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        shared-key: ${{ inputs.cache-shared-key }}
        add-rust-environment-hash-key: ${{ inputs.add-rust-environment-hash-key }}
        cache-targets: ${{ inputs.cache-targets }}
        cache-bin: false
        save-if: ${{ inputs.cache-save-if }}

    - name: Resolve Cargo home on Unix
      if: (inputs.cache-targets != 'true' || inputs.cache-target-backend == 's3') && runner.os != 'Windows'
      id: cargo-home-unix
      shell: bash
      run: echo "path=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"

    - name: Resolve Cargo home on Windows
      if: (inputs.cache-targets != 'true' || inputs.cache-target-backend == 's3') && runner.os == 'Windows'
      id: cargo-home-windows
      shell: powershell
      run: |
        $path = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
        "path=$path" | Add-Content $env:GITHUB_OUTPUT

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      if: inputs.cache-targets != 'true' && inputs.cache-target-backend == 'github'
      id: cargo-registry-cache-github
      with:
        path: |
          ${{ steps.cargo-home-unix.outputs.path || steps.cargo-home-windows.outputs.path }}/registry/cache
          ${{ steps.cargo-home-unix.outputs.path || steps.cargo-home-windows.outputs.path }}/git/db
        key: ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ inputs.toolchain }}-${{ inputs.cache-shared-key }}-${{ steps.lockfile.outputs.hash }}-v1

    - name: Prepare S3 caches
      if: inputs.cache-target-backend == 's3'
      id: s3-target-config
      shell: bash
      env:
        CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CACHE_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        CACHE_WORKSPACES: ${{ inputs.cache-workspaces }}
        CACHE_CARGO_HOME: ${{ steps.cargo-home-unix.outputs.path || steps.cargo-home-windows.outputs.path }}
        CACHE_SPARSE_INDEX_ENABLED: ${{ inputs.windows-sparse-index }}
        CACHE_SPARSE_INDEX_PATH: ${{ inputs.windows-sparse-index-path }}
        CACHE_TRANSFER: ${{ inputs.cache-s3-transfer }}
        CACHE_SHARED_KEY: ${{ inputs.cache-shared-key }}
        CACHE_ENV_HASH: ${{ inputs.add-rust-environment-hash-key == 'true' && hashFiles('**/Cargo.toml', '**/.cargo/config', '**/.cargo/config.toml', '**/rust-toolchain', '**/rust-toolchain.toml') || '' }}
        CACHE_LOCK_HASH: ${{ steps.lockfile.outputs.hash }}
        CACHE_AUTH: ${{ inputs.compiler-cache-auth }}
        CACHE_ENDPOINT: ${{ inputs.compiler-cache-endpoint }}
        CACHE_BUCKET: ${{ inputs.compiler-cache-bucket }}
        CACHE_ACCESS_KEY: ${{ inputs.compiler-cache-access-key }}
        CACHE_SECRET_KEY: ${{ inputs.compiler-cache-secret-key }}
        CACHE_SESSION_TOKEN: ${{ inputs.compiler-cache-session-token }}
      run: node "$GITHUB_ACTION_PATH/prepare-target-cache.cjs"

    - name: Restore and save S3 Cargo registry cache
      if: inputs.cache-target-backend == 's3'
      id: cargo-registry-cache-s3
      uses: tespkg/actions-cache@e07e2d4953dc8c020d447363e5064e36d04f3cf9 # v1
      env:
        AWS_SESSION_TOKEN: ${{ inputs.compiler-cache-session-token }}
      with:
        endpoint: ${{ steps.s3-target-config.outputs.endpoint }}
        port: ${{ steps.s3-target-config.outputs.port }}
        insecure: ${{ steps.s3-target-config.outputs.insecure }}
        region: auto
        bucket: ${{ inputs.compiler-cache-bucket }}
        accessKey: ${{ inputs.compiler-cache-access-key }}
        secretKey: ${{ inputs.compiler-cache-secret-key }}
        sessionToken: ${{ inputs.compiler-cache-session-token }}
        path: ${{ steps.s3-target-config.outputs.cargo-home-paths }}
        key: ${{ steps.s3-target-config.outputs.cargo-home-key }}
        use-fallback: 'false'
        restore-only: ${{ steps.s3-target-config.outputs.restore-only }}

    - name: Restore and save staged S3 target cache
      if: inputs.cache-targets == 'true' && inputs.cache-target-backend == 's3' && inputs.cache-s3-transfer == 'staged'
      id: s3-target-cache-staged
      uses: tespkg/actions-cache@e07e2d4953dc8c020d447363e5064e36d04f3cf9 # v1
      env:
        AWS_SESSION_TOKEN: ${{ inputs.compiler-cache-session-token }}
        ZSTD_CLEVEL: ${{ inputs.cache-zstd-level }}
      with:
        endpoint: ${{ steps.s3-target-config.outputs.endpoint }}
        port: ${{ steps.s3-target-config.outputs.port }}
        insecure: ${{ steps.s3-target-config.outputs.insecure }}
        region: auto
        bucket: ${{ inputs.compiler-cache-bucket }}
        accessKey: ${{ inputs.compiler-cache-access-key }}
        secretKey: ${{ inputs.compiler-cache-secret-key }}
        sessionToken: ${{ inputs.compiler-cache-session-token }}
        path: ${{ steps.s3-target-config.outputs.paths }}
        key: ${{ steps.s3-target-config.outputs.key }}
        restore-keys: ${{ steps.s3-target-config.outputs.restore-key }}
        use-fallback: 'false'
        restore-only: ${{ steps.s3-target-config.outputs.restore-only }}

    - name: Restore and save streaming S3 target cache
      if: inputs.cache-targets == 'true' && inputs.cache-target-backend == 's3' && inputs.cache-s3-transfer == 'streaming'
      id: s3-target-cache-streaming
      uses: $/.github/actions/s3-target-cache
      with:
        endpoint: ${{ steps.s3-target-config.outputs.endpoint }}
        port: ${{ steps.s3-target-config.outputs.port }}
        insecure: ${{ steps.s3-target-config.outputs.insecure }}
        region: auto
        bucket: ${{ inputs.compiler-cache-bucket }}
        access-key: ${{ inputs.compiler-cache-access-key }}
        secret-key: ${{ inputs.compiler-cache-secret-key }}
        session-token: ${{ inputs.compiler-cache-session-token }}
        path: ${{ steps.s3-target-config.outputs.paths }}
        key: ${{ steps.s3-target-config.outputs.key }}
        restore-keys: ${{ steps.s3-target-config.outputs.restore-key }}
        restore-only: ${{ steps.s3-target-config.outputs.restore-only }}
        compression-level: ${{ inputs.cache-zstd-level }}

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: runner.os == 'Windows' && inputs.windows-sparse-index == 'true' && inputs.cache-target-backend == 'github'
      id: sparse-index-cache
      with:
        path: ${{ inputs.windows-sparse-index-path }}
        key: ${{ inputs.windows-sparse-index-key || format('{0}-windows-sparse-index-{1}-{2}-v1', github.repository, inputs.toolchain, steps.lockfile.outputs.hash) }}

    - uses: $/.github/actions/setup-sccache
      id: sccache-enabled
      with:
        auth: ${{ inputs.compiler-cache-auth }}
        endpoint: ${{ inputs.compiler-cache-endpoint }}
        bucket: ${{ inputs.compiler-cache-bucket }}
        access-key: ${{ inputs.compiler-cache-access-key }}
        secret-key: ${{ inputs.compiler-cache-secret-key }}
        session-token: ${{ inputs.compiler-cache-session-token }}

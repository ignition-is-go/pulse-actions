name: S3 target cache
description: Strict S3 compiler cache with staged or Linux streaming transfer.

inputs:
  failure-policy:
    description: warn or fail on transport errors; failed saves always retain local targets.
    default: warn
  transfer:
    description: staged or streaming; streaming requires Linux.
    default: streaming
  endpoint:
    description: S3-compatible endpoint hostname.
    required: true
  port:
    description: S3-compatible endpoint port.
    required: true
  insecure:
    description: Use HTTP instead of HTTPS.
    required: true
  region:
    description: S3 region.
    default: auto
  bucket:
    description: S3 bucket.
    required: true
  access-key:
    description: S3 access key.
    required: true
  secret-key:
    description: S3 secret key.
    required: true
  session-token:
    description: Optional S3 session token.
    default: ""
  path:
    description: Newline-separated absolute paths to cache.
    required: true
  key:
    description: Exact cache key.
    required: true
  restore-keys:
    description: Ordered cache-key prefixes used after an exact miss.
    default: ""
  restore-only:
    description: Restore without saving a new cache.
    default: "false"
  compression-level:
    description: Zstandard compression level.
    default: "3"

outputs:
  cache-hit:
    description: Whether the exact key was restored.
  cache-size:
    description: Compressed cache size in bytes.
  cache-matched-key:
    description: Cache key selected for restore.

runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  post-if: success()

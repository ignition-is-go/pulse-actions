name: Action contracts

on:
  push:
    branches: [main]
    paths:
      - rust-job-setup/**
      - resource-report/**
      - setup-rust/**
      - setup-sccache/**
      - fixtures/rust-job/**
      - .github/workflows/action-contracts.yml
  pull_request:
    paths:
      - rust-job-setup/**
      - resource-report/**
      - setup-rust/**
      - setup-sccache/**
      - fixtures/rust-job/**
      - .github/workflows/action-contracts.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-job-setup:
    name: rust-job-setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: $/rust-job-setup
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache-workspaces: fixtures/rust-job
          cache-shared-key: action-contract-v1
          cache-targets: "false"
      - name: Exercise the prepared job
        run: cargo test --locked --manifest-path fixtures/rust-job/Cargo.toml
      - uses: $/resource-report
        if: always()

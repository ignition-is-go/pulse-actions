name: Contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-rust:
    name: setup-rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-24.04' && vars.CI_LINUX_RUNNER_JSON || matrix.os == 'windows-2025' && vars.CI_WINDOWS_RUNNER_JSON || vars.CI_MACOS_RUNNER_JSON) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: $/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache-workspaces: fixtures/rust-job
          cache-shared-key: contract-v1
          cache-targets: "false"
      - name: Exercise the configured job
        run: cargo test --locked --manifest-path fixtures/rust-job/Cargo.toml
      - uses: $/actions/report-resources
        if: always()

  public-contract:
    name: public contract
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER_JSON) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install archive compression tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - run: ./scripts/check-public-contract.sh
      - run: ./scripts/test-action-pin-check.sh
      - run: ./scripts/test-workflow-validation.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: ./scripts/test-sccache-unreachable.sh
      - run: node scripts/test-s3-artifact-failure.cjs

  s3-target-cache:
    name: S3 target cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-24.04' && vars.CI_LINUX_RUNNER_JSON || matrix.os == 'windows-2025' && vars.CI_WINDOWS_RUNNER_JSON || vars.CI_MACOS_RUNNER_JSON) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install archive compression tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Configure Windows archive tools
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command bash).Source -Parent) -Parent
          $gitTools = Join-Path $gitRoot 'usr\bin'
          if (-not (Test-Path (Join-Path $gitTools 'tar.exe'))) {
            throw 'Git GNU tar is required by the archive contract.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'archive-tools'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $zstd = (Get-Command zstd).Source
          Copy-Item $zstd (Join-Path $directory 'zstdmt.exe')
          Copy-Item $zstd (Join-Path $directory 'unzstd.exe')
          $gitTools, $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: node --test scripts/test-target-cache.cjs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Build, save, delete, restore and test offline
        run: uv run scripts/test-s3-target-cache.py

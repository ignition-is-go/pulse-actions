name: Contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-rust:
    name: setup-rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache-workspaces: fixtures/rust-job
          cache-shared-key: contract-v1
          cache-targets: "false"
      - name: Exercise the configured job
        run: cargo test --locked --manifest-path fixtures/rust-job/Cargo.toml
      - uses: $/actions/report-resources
        if: always()

  public-contract:
    name: public contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check-public-contract.sh
      - run: ./scripts/test-action-pin-check.sh
      - run: ./scripts/test-workflow-validation.sh
      - run: ./scripts/test-sccache-unreachable.sh
      - run: node scripts/test-s3-artifact-failure.cjs

  s3-target-cache:
    name: S3 target cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/test-target-cache.cjs
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build, save, delete, restore and test offline
        run: uv run scripts/test-s3-target-cache.py

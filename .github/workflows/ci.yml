name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    name: public surface
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER_JSON) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject private infrastructure references
        run: ./scripts/check-public-surface.sh
      - name: Scan reachable history for secrets
        run: |
          stage="$RUNNER_TEMP/gitleaks"
          mkdir -p "$stage"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output "$stage/gitleaks.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $stage/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$stage/gitleaks.tar.gz" -C "$stage" gitleaks
          status=0
          "$stage/gitleaks" detect --source=. --no-banner --redact --log-opts=--all \
            --gitleaks-ignore-path="$GITHUB_WORKSPACE/.gitleaksignore" \
            --report-format=json --report-path="$stage/report.json" || status=$?
          python3 -c 'import json,sys; [print({k:x.get(k) for k in ["File","StartLine","Commit","Fingerprint"]}) for x in json.load(open(sys.argv[1]))]' "$stage/report.json"
          exit "$status"

  actionlint:
    name: actionlint
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER_JSON) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: $/.github/actions/validate-workflows
      - name: Verify lockfile hash is captured once
        run: ./scripts/check-lockfile-hash-capture.sh
      - name: Reject mutable action references
        run: ./.github/actions/validate-workflows/check-action-pins.sh
      - name: Verify the public contract
        run: ./scripts/check-public-contract.sh

  zizmor:
    name: zizmor
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER_JSON) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.32.0 --persona=regular --format=github --color=always -- .

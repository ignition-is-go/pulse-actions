name: Rust native job

on:
  workflow_call:
    inputs:
      runner-json:
        type: string
        required: true
      package:
        type: string
        required: true
      target:
        type: string
        required: true
      toolchain:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: true
      target-cache:
        type: boolean
        required: true
    secrets:
      CI_CACHE_ENDPOINT:
        required: false
      CI_CACHE_BUCKET:
        required: false
      CI_CACHE_ACCESS_KEY:
        required: false
      CI_CACHE_SECRET_KEY:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - uses: $/resource-report
      - uses: $/setup-rust
        id: rust
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ inputs.target }}
          cache-shared-key: native-${{ inputs.target }}-v1
          cache-targets: ${{ inputs.target-cache }}
          windows-sparse-index: ${{ runner.os == 'Windows' }}
          sccache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          sccache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - name: Build on Linux or macOS
        if: runner.os != 'Windows'
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
        run: cargo build --release --locked --package "$PACKAGE" --target "$TARGET"
      - name: Build on Windows
        if: runner.os == 'Windows'
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
        run: cargo build --release --locked --package "$env:PACKAGE" --target "$env:TARGET"
      - uses: $/resource-report
        if: always()

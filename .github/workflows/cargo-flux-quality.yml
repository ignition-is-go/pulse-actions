name: Cargo Flux quality

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: stable
      cargo-flux-version:
        type: string
        required: true
      tasks:
        description: Space-separated Cargo Flux task names.
        type: string
        default: check lint test
      targets:
        type: string
        default: ""
      linux-runner-json:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 45
      cache-target-backend:
        description: Cargo cache backend (github, s3, or flux-s3). flux-s3 uses native Flux snapshots and requires [cache.s3].
        type: string
        default: github
      cache-s3-transfer:
        description: Legacy setup-rust transfer setting; native Flux snapshots use Flux streaming.
        type: string
        default: staged
      cache-zstd-level:
        description: Legacy setup-rust compression setting; native snapshots use Flux configuration.
        type: string
        default: "3"
      compiler-cache-auth:
        description: Compiler-cache authentication mode (static, ambient, or anonymous).
        type: string
        default: static
      compiler-cache-endpoint:
        description: Non-secret S3-compatible endpoint. Takes precedence over CI_CACHE_ENDPOINT.
        type: string
        default: ""
      compiler-cache-bucket:
        description: Non-secret S3-compatible bucket. Takes precedence over CI_CACHE_BUCKET.
        type: string
        default: ""
    secrets:
      CI_CACHE_ENDPOINT:
        required: false
      CI_CACHE_BUCKET:
        required: false
      CI_CACHE_ACCESS_KEY:
        required: false
      CI_CACHE_SECRET_KEY:
        required: false
      CI_CACHE_SESSION_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Cargo Flux check
    runs-on: ${{ fromJSON(inputs.linux-runner-json) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/actions/report-resources
      - uses: $/actions/setup-rust
        with:
          cache-targets: ${{ inputs.cache-target-backend != 'flux-s3' }}
          toolchain: ${{ inputs.toolchain }}
          cache-target-backend: ${{ inputs.cache-target-backend == 'flux-s3' && 's3' || inputs.cache-target-backend }}
          cache-s3-transfer: ${{ inputs.cache-s3-transfer }}
          cache-zstd-level: ${{ inputs.cache-zstd-level }}
          components: clippy
          targets: ${{ inputs.targets }}
          linux-dependencies: openssl
          cache-shared-key: cargo-flux-quality-v1
          compiler-cache-auth: ${{ inputs.compiler-cache-auth }}
          compiler-cache-endpoint: ${{ inputs.compiler-cache-endpoint || secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ inputs.compiler-cache-bucket || secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_ACCESS_KEY || '' }}
          compiler-cache-secret-key: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_SECRET_KEY || '' }}
          compiler-cache-session-token: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_SESSION_TOKEN || '' }}
      - name: Set up Cargo Flux and its native S3 client
        uses: ignition-is-go/cargo-flux@eecab76c2c1296cb7e9e5b8d8d72149e49282fb4 # v0.11.7
        with:
          version: ${{ inputs.cargo-flux-version }}
          cache: ${{ (inputs.cache-target-backend == 's3' || inputs.cache-target-backend == 'flux-s3') && 's3' || '' }}
          cache-endpoint: ${{ inputs.compiler-cache-endpoint || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ inputs.compiler-cache-bucket || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_ACCESS_KEY || '' }}
          cache-secret-access-key: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_SECRET_KEY || '' }}
          cache-session-token: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_SESSION_TOKEN || '' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: inputs.cache-target-backend == 'flux-s3'
        with:
          python-version: '3.12'
      - name: Restore native Flux compiler snapshot
        if: inputs.cache-target-backend == 'flux-s3'
        id: flux-target-cache
        uses: $/actions/flux-target-cache
        with:
          operation: restore
      - name: Run Cargo Flux tasks
        env:
          FLUX_TASKS: ${{ inputs.tasks }}
        run: |
          for task in $FLUX_TASKS; do
            cargo flux run "$task"
          done
      - name: Save native Flux snapshot and clean local targets
        if: success() && inputs.cache-target-backend == 'flux-s3'
        uses: $/actions/flux-target-cache
        with:
          operation: save
          state: ${{ steps.flux-target-cache.outputs.state }}
      - uses: $/actions/report-resources
        if: always()

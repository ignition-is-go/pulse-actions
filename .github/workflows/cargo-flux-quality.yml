name: Cargo Flux quality

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: stable
      cargo-flux-version:
        type: string
        required: true
      tasks:
        description: Space-separated Cargo Flux task names.
        type: string
        default: check lint test
      targets:
        type: string
        default: ""
      linux-runner-json:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 45
      compiler-cache-auth:
        description: Compiler-cache authentication mode (static, ambient, or anonymous).
        type: string
        default: static
      compiler-cache-endpoint:
        description: Non-secret S3-compatible endpoint. Takes precedence over CI_CACHE_ENDPOINT.
        type: string
        default: ""
      compiler-cache-bucket:
        description: Non-secret S3-compatible bucket. Takes precedence over CI_CACHE_BUCKET.
        type: string
        default: ""
    secrets:
      CI_CACHE_ENDPOINT:
        required: false
      CI_CACHE_BUCKET:
        required: false
      CI_CACHE_ACCESS_KEY:
        required: false
      CI_CACHE_SECRET_KEY:
        required: false
      CI_CACHE_SESSION_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Cargo Flux check
    runs-on: ${{ fromJSON(inputs.linux-runner-json) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/actions/report-resources
      - uses: $/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
          targets: ${{ inputs.targets }}
          linux-dependencies: openssl
          cache-shared-key: cargo-flux-quality-v1
          compiler-cache-auth: ${{ inputs.compiler-cache-auth }}
          compiler-cache-endpoint: ${{ inputs.compiler-cache-endpoint || secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ inputs.compiler-cache-bucket || secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_ACCESS_KEY || '' }}
          compiler-cache-secret-key: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_SECRET_KEY || '' }}
          compiler-cache-session-token: ${{ inputs.compiler-cache-auth == 'static' && secrets.CI_CACHE_SESSION_TOKEN || '' }}
      - name: Install Cargo Flux
        env:
          CARGO_FLUX_VERSION: ${{ inputs.cargo-flux-version }}
        run: cargo install cargo-flux --version "$CARGO_FLUX_VERSION" --locked
      - name: Run Cargo Flux tasks
        env:
          FLUX_TASKS: ${{ inputs.tasks }}
        run: |
          for task in $FLUX_TASKS; do
            cargo flux run "$task"
          done
      - uses: $/actions/report-resources
        if: always()
